name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, pairing links, private hostnames, or terminal transcripts. See SECURITY.md for security reports."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected behavior and what you observed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: macOS, cmux, Bun, Tailscale, browser, and cmux Remote revision.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Relevant doctor output or error messages. Remove private data first.
